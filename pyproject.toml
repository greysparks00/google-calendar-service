[project]
name = "googlecalendar"
description = "Google Calendar connection for Junction"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
